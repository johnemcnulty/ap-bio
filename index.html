function tapMito(t){
  if(!G || !G.running || G.over || t.busy || G.lock>0 || G.spot>0) return;
  const L = G.L, k = t.k;
  if(L.stage==='krebs'){
    if(k==='pyr') return pox(t);
    if(k==='acoa') return feedKrebs(t);
  } else {
    if(k==='nadh' || k==='fadh2') return unload(t);
    if(k==='o2') return giveO2(t);
  }
  wrongTap(t, MITO_WRONG[k] || 'That molecule has no job here.');
}
function wrongTap(t, why){
  const g = G; g.lock = 0.6; t.el.classList.add('wrong'); flash(why,'bad');
  setTimeout(()=>{ t.el.classList.remove('wrong'); if(t.decoy && g.tokens.includes(t)){ t.el.remove(); g.tokens = g.tokens.filter(x=>x!==t); } }, 700);
}

/* Pyruvate oxidation: pyruvate gives up a carbon (CO₂) and an electron pair (to NAD⁺), leaving acetyl-CoA */
async function pox(t){
  const g = G;
  if(g.pools.nad<1){ flash('There is no empty NAD⁺ left to take the electrons.','bad'); return; }
  g.pools.nad--; g.car.useN++; g.anims++;
  detach(t); t.y = Math.max(t.y, 40); place(t);
  const quick = (g.spotN.pox||0) >= SPOT_SLOW; g.spotN.pox = (g.spotN.pox||0)+1;
  await pause(60);
  if(quick) await spotlight(g, {title:RXN.pox.name, srcs:[t.el,$('carrier')], dests:[t.el], ins:[['pyr'],['nad']], hop:[0,1], swaps:{0:['acoa'],1:['nadh']}, add:[['co2']],
    text:SPOT_TEXT.pox, go:'Take the electrons', onSwap:()=>setTok(t,'acoa')}, quick);
  else await sceneSpot(g, buildPox, t.el);
  if(G!==g) return;
  setTok(t,'acoa');
  if(G!==g) return;
  discover('pox');
  t.w = t.el.offsetWidth;
  const [fw] = fieldSize();
  if(t.x+t.w > fw-2){ t.x = fw-t.w-2; place(t); }
  const nx = t.x+t.w+8 < fw-110 ? t.x+t.w+8 : Math.max(2, t.x-118);
  spawnToken('nadh', nx, t.y); g.car.useN--; g.car.loadN++;
  flyChips('co2',1, center(t.el), $('pool-co2'), ()=>{ g.pools.co2 += 1; });
  t.busy = false; t.el.classList.remove('busy','moving'); g.tokens.push(t);
  g.anims--;
}

/* Krebs cycle */
function feedKrebs(t){
  const g = G, kr = g.krebs;
  if(kr.state!=='idle'){ flash('The cycle is mid-turn. Feed in the next acetyl-CoA when it finishes.','bad'); return; }
  if(g.pools.nad<3 || g.pools.fad<1){ flash(`A turn needs 3 empty NAD⁺ and 1 FAD. Right now there are ${g.pools.nad} NAD⁺ and ${g.pools.fad} FAD.`,'bad'); return; }
  const from = center(t.el); detach(t); t.el.remove();
  krebsStart(g, true, from);
}
async function krebsStart(g, manual, from){
  const kr = g.krebs; kr.state = 'turning'; kr.t = 0; kr.cyc = manual ? 1.2 : (g.L.krebsCycle||3.5);
  g.pools.nad -= 3; g.pools.fad -= 1; g.car.useN += 3; g.car.useF += 1;
  const ke = $('krebs');
  showDelta($('carrier'),'−3 NAD⁺, −1 FAD','nad');
  for(let j=0;j<3;j++) flyChip('nad', center($('carrier')), center(ke), j*120, 600);
  flyChip('fad', center($('carrier')), center(ke), 360, 600);
  if(!manual) return;
  g.anims++;
  if(from) await flyChip('acoa', from, center(ke), 0, 600);
  if(G!==g) return;
  const quick = (g.spotN.krebsT||0) >= SPOT_SLOW; g.spotN.krebsT = (g.spotN.krebsT||0)+1;
  if(quick) await spotlight(g, {title:'Krebs cycle', srcs:[ke], dests:[ke], ins:[['acoa'],['nad',3],['fad']], hop:[0,1], swaps:{0:['co2',2],1:['nadh',3],2:['fadh2']}, add:[['atp']],
    text:SPOT_TEXT.krebsT, go:'Turn the cycle'}, quick);
  else await sceneSpot(g, buildKrebs, ke);
  if(G!==g) return;
  discover('krebsT'); g.anims--;
}
async function krebsDone(g){
  g.anims++;
  const tray = $('ktray');
  tray.innerHTML = [['co2',2],['nadh',3],['fadh2',1],['atp',1]].map(([k,n])=>`<span class="grp" data-k="${k}" style="--c:${MOLS[k].c}">${molSVG(k,18)}${lbl(k,n)}</span>`).join('');
  await wait(900); if(G!==g) return;
  const grp = k => tray.querySelector(`[data-k="${k}"]`);
  const fC=center(grp('co2')), fN=center(grp('nadh')), fF=center(grp('fadh2')), fA=center(grp('atp'));
  const ps = [ flyChips('co2',2, fC, $('pool-co2'), ()=>{ g.pools.co2 += 2; }), flyChips('atp',1, fA, $('pool-atp'), ()=>{ g.pools.atp += 1; }) ];
  const f = $('field'), fr = f.getBoundingClientRect(), fw = f.clientWidth;
  ['nadh','nadh','nadh','fadh2'].forEach((k,j)=>{
    const x = clamp(fw*(0.04+0.23*j) + (Math.random()-.5)*16, 2, fw-110), y = 8 + (j%2)*44;
    ps.push(flyChip(k, k==='nadh'?fN:fF, [fr.left+x+50, fr.top+y+18], j*140, 850).then(()=>{
      if(G!==g || g.over) return;
      spawnToken(k, x, y);
      if(k==='nadh'){ g.car.useN--; g.car.loadN++; } else { g.car.useF--; g.car.loadF++; }
    }));
  });
  tray.innerHTML = ''; g.krebs.state = 'idle'; g.krebs.t = 0;
  await Promise.all(ps); g.anims--;
}

/* Electron transport chain: a loaded carrier drops its electrons, which pump H⁺ at each complex on the way to complex IV */
async function unload(t){
  const g = G, isN = t.k==='nadh', key = isN ? 'etcN' : 'etcF';
  if(g.chain.res>=4){ flash('The chain is backed up. The electrons at complex IV have nowhere to go, so no carrier can unload. Complex IV needs O₂.','bad'); bumpEl($('cx4')); return; }
  g.chain.res++; g.anims++;
  if(isN){ g.car.loadN--; g.car.useN++; } else { g.car.loadF--; g.car.useF++; }
  const from = center(t.el), kind = t.k; detach(t); t.el.remove();
  const quick = (g.spotN[key]||0) >= SPOT_SLOW; g.spotN[key] = (g.spotN[key]||0)+1;
  let np = null;
  if(!quick){
    $('etc').scrollIntoView({block:'center', behavior:reduceMotion?'auto':'smooth'});
    np = narrPanel(g, RXN[key].name);
    await narrStep(np, SPOT_TEXT[key][0], 'Follow the electrons', ['hiE']); if(G!==g) return;
    np.querySelector('p').textContent = 'Watch the electron pair move along the chain, and count the H⁺ pumped up at each stop.'; setQs(np.querySelector('.qrow'), []);
  }
  const D = quick ? 1 : 1.8, entry = $(isN?'cx1':'cx2');
  await flyChip(kind, from, center(entry), 0, 550*D); if(G!==g) return;
  flyChips(isN?'nad':'fad',1, center(entry), $('carrier'), ()=>{ if(isN){ g.pools.nad++; g.car.useN--; } else { g.pools.fad++; g.car.useF--; } });
  const steps = isN ? [['cx1',4],['cx3',4],['cx4',2]] : [['cx2',0],['cx3',4],['cx4',2]];
  for(let s=0;s<steps.length;s++){
    const [id,n] = steps[s], el = $(id); if(!el) return;
    if(s>0){ await flyChip('e2', center($(steps[s-1][0])), center(el), 0, 380*D); if(G!==g) return; }
    el.classList.add('hot'); setTimeout(()=>el.classList.remove('hot'), 700);
    if(n){ const p = flyChips('hplus', n, center(el), $('ims'), ()=>{ g.hp += n; }); if(!quick) await p; }
    else if(!quick) await pause(600);
    if(G!==g) return;
  }
  g.chain.wait++;
  discover(key);
  if(np){ await narrStep(np, SPOT_TEXT[key][1], 'Continue', ['pump','o2']); narrEnd(g, np); }
  g.anims--;
}
/* Oxygen takes up to 2 electron pairs waiting at complex IV and becomes water */
async function giveO2(t){
  const g = G;
  if(g.chain.wait<1){ flash('No electrons are waiting at complex IV yet. Unload a loaded carrier first.','bad'); return; }
  const n = Math.min(2, g.chain.wait); g.chain.wait -= n; g.chain.res -= n; g.anims++;
  detach(t);
  const quick = (g.spotN.o2x||0) >= SPOT_SLOW; g.spotN.o2x = (g.spotN.o2x||0)+1;
  const cx4 = $('cx4');
  await spotlight(g, {title:RXN.o2x.name, srcs:[t.el,cx4], dests:[cx4], ins:[['o2'],['e2',n]], hop:[1,0], swaps:{0:['h2o',n],1:null},
    text:SPOT_TEXT.o2x, go:'Hand over the electrons', qs:['o2','hiE']}, quick);
  if(G!==g) return;
  discover('o2x');
  t.el.remove();
  flyChips('h2o', n, center(cx4), $('pool-h2o'), ()=>{ g.pools.h2o += n; });
  if(n===1){ g.chain.acc += 1; flash('That O₂ had room for 2 electron pairs. Half of it is still waiting at complex IV for the next pair.','good'); }
  g.anims--;
}
/* ATP synthase: 4 H⁺ back into the matrix make 1 ATP */
function synth(g){
  g.hp -= 4;
  if(!g.found.has('syn') && !g.synSlow){ g.synSlow = true; synthSlow(g); return; }
  const syn = $('syn'); syn.classList.add('hot'); setTimeout(()=>syn.classList.remove('hot'), 400);
  flyChips('hplus',4, center($('ims')), syn, null, '').then(()=>{ if(G===g) flyChips('atp',1, center(syn), $('pool-atp'), ()=>{ g.pools.atp += 1; }); });
}
async function synthSlow(g){
  g.anims++;
  $('etc').scrollIntoView({block:'center', behavior:reduceMotion?'auto':'smooth'});
  const np = narrPanel(g, RXN.syn.name);
  await narrStep(np, SPOT_TEXT.syn[0], 'Let the H⁺ back in', ['gradient']); if(G!==g) return;
  np.querySelector('p').textContent = 'Watch 4 H⁺ flow back through ATP synthase…'; setQs(np.querySelector('.qrow'), []);
  const syn = $('syn');
  await flyChips('hplus',4, center($('ims')), syn, null, ''); if(G!==g) return;
  syn.classList.add('hot');
  await flyChips('atp',1, center(syn), $('pool-atp'), ()=>{ g.pools.atp += 1; }); if(G!==g) return;
  syn.classList.remove('hot');
  discover('syn');
  await narrStep(np, SPOT_TEXT.syn[1], 'Continue', ['synthase','atp']); narrEnd(g, np); g.anims--;
}
/* Uncoupler leaks */
function makeHole(g){
  const m = $('membrane'); if(!m) return;
  const b = document.createElement('button'); b.className='hole'; b.type='button'; b.textContent='leak'; b.setAttribute('aria-label','Plug the leak');
  b.style.left = (6 + Math.random()*80)+'%'; m.appendChild(b);
  const h = {el:b}; g.holes.push(h);
  b.onclick = ()=>{ if(!g.running || g.over || g.spot>0) return; b.remove(); g.holes = g.holes.filter(x=>x!==h); flash('Leak plugged.','good'); };
  if(!g.told.leak){
    g.told.leak = true;
    (async()=>{ $('etc').scrollIntoView({block:'center', behavior:reduceMotion?'auto':'smooth'}); const np = narrPanel(g,'A leak in the membrane'); await narrStep(np, SPOT_TEXT.leak[0], 'Got it', ['uncoupler']); if(G===g) narrEnd(g, np); })();
  }
}

function tickMito(dt){
  if(G.spot>0) return; // the clock and everything else wait while a step is being explained
  const g = G, L = g.L, p = g.pools; g.time += dt;
  if(g.lock>0) g.lock -= dt;
  if(L.stage==='krebs' && g.pyrLeft>0){ g.pyrT -= dt; if(g.pyrT<=0){ g.pyrT = L.inflowEvery; g.pyrLeft--; spawnToken('pyr', 4+Math.random()*60, 4); } }
  if(L.stage==='etc'){ g.o2T -= dt; if(g.o2T<=0){ g.o2T = L.o2Every; if(g.tokens.filter(t=>t.k==='o2').length<3) spawnToken('o2'); } }
  g.decoyT -= dt;
  if(g.decoyT<=0){ g.decoyT = 5 + Math.random()*3; if(L.decoys && g.tokens.filter(t=>t.decoy).length<2) spawnToken(L.decoys[Math.floor(Math.random()*L.decoys.length)], null, null, true); }
  const kr = g.krebs;
  if(kr.state==='idle' && L.krebsAuto && p.nad>=3 && p.fad>=1) krebsStart(g, false);
  if(kr.state==='turning'){ kr.t += dt; if(kr.t>=kr.cyc){ kr.state='unloading'; krebsDone(g); } }
  if(L.stage==='etc'){
    if(g.chain.acc>0 && g.chain.wait>0){ g.chain.acc--; g.chain.wait--; g.chain.res--; flyChips('h2o',1, center($('cx4')), $('pool-h2o'), ()=>{ p.h2o += 1; }); }
    g.synT += dt; if(g.hp>=4 && g.synT>=0.6){ g.synT = 0; synth(g); }
    if(L.holes){
      g.holeT -= dt; if(g.holeT<=0){ g.holeT = L.holes.every; if(g.holes.length<L.holes.max) makeHole(g); }
      g.leakT += dt;
      if(g.leakT>=L.holes.rate){ g.leakT = 0; g.holes.forEach(h=>{ if(g.hp>0){ g.hp--; p.heat++; flyChip('hplus', center($('ims')), center(h.el), 0, 450); } }); }
    }
  }
  const [w,h] = fieldSize();
  for(const t of [...g.tokens]){
    t.age += dt;
    if(t.decoy && t.age>16 && !t.busy){ t.el.remove(); g.tokens = g.tokens.filter(x=>x!==t); continue; }
    if(t.decoy && t.age>13) t.el.classList.add('fade');
    if(t.busy) continue;
    t.x += t.vx*dt; t.y += t.vy*dt;
    if(t.x<2){t.x=2;t.vx=Math.abs(t.vx);} if(t.x>w-t.w-2){t.x=w-t.w-2;t.vx=-Math.abs(t.vx);}
    if(t.y<2){t.y=2;t.vy=Math.abs(t.vy);} if(t.y>h-t.h-2){t.y=h-t.h-2;t.vy=-Math.abs(t.vy);}
    place(t);
  }
  if(L.goal.type==='co2' && p.co2>=L.goal.target && g.anims===0) return endLevel(true);
  if(L.goal.type==='atp' && p.atp>=L.goal.target) return endLevel(true);
  if(L.goal.limit && g.time>=L.goal.limit) return endLevel(false,'Time ran out before the ATP tank filled.');
  const active = g.anims>0 || kr.state!=='idle' || g.hp>=4 || (L.stage==='krebs' && g.pyrLeft>0);
  if(!active){ g.stallT += dt; if(g.stallT>6 && !g.hintOn){ g.hintOn = true; $('hintbox').innerHTML = `<div class="hint"><strong>Things have stopped.</strong> ${L.hint}</div>`; } }
  else g.stallT = 0;
}

function renderMito(){
  const g = G, L = g.L, p = g.pools;
  ['atp','co2','h2o','heat'].forEach(k=>{ const el=$('pool-'+k); if(!el) return; const v=el.querySelector('.v'), s=String(p[k]); if(v.textContent!==s) v.textContent=s; });
  const key = [p.nad,g.car.useN,g.car.loadN,p.fad,g.car.useF,g.car.loadF].join('/');
  if(cache.car!==key){
    cache.car = key;
    const dots = (e,u,l)=>'<span></span>'.repeat(Math.max(0,e))+'<span class="busy"></span>'.repeat(Math.max(0,u))+'<span class="full"></span>'.repeat(Math.max(0,l));
    $('dots').innerHTML = dots(p.nad, g.car.useN, g.car.loadN);
    $('fdots').innerHTML = dots(p.fad, g.car.useF, g.car.loadF);
    setText('carriertxt', `NAD⁺ ${p.nad} empty, ${g.car.loadN} loaded · FAD ${p.fad} empty, ${g.car.loadF} loaded`);
    $('carrier').classList.toggle('empty', (p.nad<3 || p.fad<1) && (g.car.loadN+g.car.loadF)>0);
  }
  let frac;
  if(L.goal.type==='co2'){ frac = p.co2/L.goal.target; setText('goaltxt', `Carbons out as CO₂: ${p.co2} / ${L.goal.target}`); setText('clock', fmt(g.time)); }
  else { frac = p.atp/L.goal.target; setText('goaltxt', `ATP ${p.atp} / ${L.goal.target}`); setText('clock', L.goal.limit ? fmt(L.goal.limit-g.time)+' left' : fmt(g.time)); }
  $('goalbar').style.width = clamp(frac*100,0,100)+'%';
  const kr = g.krebs, ke = $('krebs');
  let ks, kc = 'machine';
  if(kr.state==='turning'){ ks = 'Turning'; kc += ' running'; }
  else if(kr.state==='unloading'){ ks = 'Done!'; kc += ' running'; }
  else if(p.nad<3 || p.fad<1){ ks = 'Waiting for empty carriers'; kc += ' waiting'; }
  else ks = L.krebsAuto ? 'Ready' : 'Waiting for acetyl-CoA';
  setText('kstat', ks); if(ke.className!==kc) ke.className = kc;
  $('kprog').style.width = (kr.state==='turning' ? clamp(kr.t/kr.cyc,0,1)*100 : kr.state==='unloading' ? 100 : 0)+'%';
  if(L.stage==='etc'){
    setText('hcount', `${g.hp} H⁺`);
    if(cache.hd!==g.hp){ cache.hd = g.hp; $('hdots').innerHTML = '<i></i>'.repeat(Math.min(g.hp,60)) + (g.hp>60 ? `<span class="legend">+${g.hp-60}</span>` : ''); }
    const ew = g.chain.wait+'/'+g.chain.acc;
    if(cache.ew!==ew){ cache.ew = ew; $('ewait').innerHTML = '<i></i>'.repeat(g.chain.wait) + (g.chain.acc ? '<small>½ O₂</small>' : ''); }
    $('cx4').classList.toggle('full', g.chain.res>=4);
  }
  setText('fieldtip', L.stage==='krebs' ? 'Tap a molecule to use it' : 'Tap a loaded carrier, or an O₂');
}

/* ================= End of level ================= */
function endLevel(win, reason){
  G.over = true; G.running = false;
  const L = G.L;
  if(win){
    let stars, how, tip='';
    if(L.goal.type==='runs'){ stars = G.runs>=L.stars[1]?3:G.runs>=L.stars[0]?2:1; how=`${G.runs} runs: ${G.made.atp} ATP made, ${G.made.spent} spent, so the cell gained ${G.made.atp-G.made.spent}.`; if(stars<3) tip=`Three stars: ${L.stars[1]} runs in one shift`; }
    else if(L.goal.type==='survive'){ stars = G.pools.atp>=L.stars[1]?3:G.pools.atp>=L.stars[0]?2:1; how=`Finished with ${G.pools.atp} ATP to spare.`; if(stars<3) tip=`Three stars: finish with ${L.stars[1]}+ ATP left`; }
    else { stars = G.time<=L.stars[0]?3:G.time<=L.stars[1]?2:1; how=`Done in ${Math.ceil(G.time)} seconds.`; if(stars<3) tip=`Three stars: finish in ${L.stars[0]} s or less`; }
    progress[G.i] = Math.max(progress[G.i]||0, stars); saveProgress();
    const next = G.i < LEVELS.length-1;
    const rxs = (L.summary || (L.discover&&L.discover.length ? L.discover : null) || (L.mode==='assemble'?['glyco']:['lactic'])).map(k=>`<div class="rx"><strong>${RXN[k].name}</strong>${eqHTML(RXN[k])}</div>`).join('');
    modal(`<div class="label">Shift complete</div><h2>${L.name}</h2>
      <div class="bigstars">${starHTML(stars,'')}</div><p style="text-align:center">${how}</p>${tip?`<p class="label" style="text-align:center">${tip}</p>`:''}
      <div class="lesson"><strong>What happened:</strong> ${L.lesson}</div>${rxs}
      <div class="actions"><button class="btn ghost" id="lvls">All levels</button><button class="btn ghost" id="replay">Replay</button>${next?'<button class="btn" id="next">Next level</button>':'<button class="btn" id="home">Finish tier</button>'}</div>`, ()=>{
        $('replay').onclick=()=>startLevel(G.i); $('lvls').onclick=()=>showHome();
        const n=$('next'); if(n) n.onclick=()=>startLevel(G.i+1);
        const h=$('home'); if(h) h.onclick=()=>showHome();
      });
  } else {
    modal(`<div class="label">Shift over</div><h2>${reason}</h2><p>${L.hint}</p>
      <div class="actions"><button class="btn ghost" id="lv">All levels</button><button class="btn" id="retry">Try again</button></div>`, ()=>{
        $('retry').onclick=()=>startLevel(G.i);
        $('lv').onclick=()=>showHome();
      });
  }
}

/* ================= Modal and loop ================= */
function modal(html, wire){
  layer.innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  wire && wire();
  const f = layer.querySelector('.btn:not(.ghost)') || layer.querySelector('.btn'); f && f.focus({preventScroll:true});
}
function closeModal(){ layer.innerHTML=''; }
function loop(t){
  const dt = Math.min(0.1, (t-lastT)/1000 || 0); lastT = t;
  if(G && G.running && !G.over){ if(G.mode==='assemble') tickAssemble(dt); else if(G.mode==='mito') tickMito(dt); else tickHands(dt); }
  if(G && !G.over){
    if(G.mode==='assemble' && $('stream')) renderAssemble();
    if(G.mode==='hands' && $('field')) renderHands();
    if(G.mode==='mito' && $('field')) renderMito();
  }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', ()=>{ lastT = performance.now(); });
showHome();
requestAnimationFrame(loop);
</script>
